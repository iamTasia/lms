spring.application.name=lms

# Database Configuration
# NOTE: When running via docker-compose, these are overridden by environment variables.
# The values below serve as defaults for local development without Docker.
spring.datasource.url=jdbc:postgresql://localhost:5432/lms
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:#JIM*fam.fr}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

